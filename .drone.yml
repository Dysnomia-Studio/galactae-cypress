kind: pipeline
name: galactae-cypress

steps:
- name: tests-chrome81-ff75
  image: cypress/browsers:node13.8.0-chrome81-ff75
  commands:
  - npm ci
  - $(npm bin)/cypress run --browser firefox
  - $(npm bin)/cypress run --browser chrome

- name: tests-chrome78-ff70-brave78
  image: cypress/browsers:node12.13.0-chrome78-ff70-brave78
  commands:
  - npm ci
  - $(npm bin)/cypress run --browser firefox
  - $(npm bin)/cypress run --browser chrome
  - $(npm bin)/cypress run --browser brave

- name: discord
  pull: default
  image: appleboy/drone-discord
  settings:
    webhook_id: ***REMOVED***
    webhook_token: ***REMOVED***
    message: >
      {{#success build.status}}
        Automated clientside end-to-end tests succeded
      {{else}}
        Automated clientside end-to-end tests failed
      {{/success}}
  when:
    status: 
    - changed
    - failure
    - success